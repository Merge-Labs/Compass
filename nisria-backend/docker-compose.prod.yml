services:
  web:
    build: .
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENV=production
      - DATABASE_HOST=db
      - DATABASE_NAME=main
      - DATABASE_USER=manassehgitau
      - DATABASE_PASSWORD=Evalyne6415
      - DATABASE_PORT=5432
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - ALLOWED_HOSTS=localhost,nisria-frontend.vercel.app,manassehgitau.com,www.manassehgitau.com,api-compass.manassehgitau.com
      - DEBUG=False
      - SKIP_COLLECTSTATIC=0
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: manassehgitau
      POSTGRES_PASSWORD: Evalyne6415
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
  static_volume:
