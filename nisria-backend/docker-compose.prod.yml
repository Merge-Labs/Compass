version: "3.8"
services:
  web:
    build: .
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENV=production
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
    expose:
      - "8000"
    restart: always
    depends_on:
      - db
      - redis
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nisria_db
      POSTGRES_USER: manassehgitau
      POSTGRES_PASSWORD: Evalyne@6415!
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
volumes:
  postgres_data:
  static_volume:
