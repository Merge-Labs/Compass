# Docker Compose for local development/testing
# For Coolify deployment, use the Dockerfile directly with environment variables
version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nisria}
      POSTGRES_USER: ${DATABASE_USER:-nisria}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nisria}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-nisria} -d ${DATABASE_NAME:-nisria}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_TYPE=web
      - DEBUG=0
      - DJANGO_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DATABASE_USER:-nisria}:${DATABASE_PASSWORD:-nisria}@db:5432/${DATABASE_NAME:-nisria}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_TYPE=celery-worker
      - DEBUG=0
      - DJANGO_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DATABASE_USER:-nisria}:${DATABASE_PASSWORD:-nisria}@db:5432/${DATABASE_NAME:-nisria}
      - REDIS_URL=redis://redis:6379/0
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_TYPE=celery-beat
      - DEBUG=0
      - DJANGO_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DATABASE_USER:-nisria}:${DATABASE_PASSWORD:-nisria}@db:5432/${DATABASE_NAME:-nisria}
      - REDIS_URL=redis://redis:6379/0
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
